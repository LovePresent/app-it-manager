services:
  backend:
    build: ./backend
    container_name: itam-local-backend
    restart: unless-stopped
    command: sh -c "python seed_categories.py && uvicorn app.main:app --host 0.0.0.0 --port 8818"
    environment:
      PYTHONDONTWRITEBYTECODE: '1'
      DATABASE_URL: sqlite:///./data/itam.db
      AUTHENTIK_BASE_URL: http://localhost
      AUTHENTIK_CLIENT_ID: local-dev
      AUTHENTIK_CLIENT_SECRET: local-dev
      AUTHENTIK_REDIRECT_URI: http://localhost:3000/manage/it/api/v1/auth/callback
      AUTHENTIK_JWKS_URL: http://localhost/application/o/itam/jwks/
      AUTHENTIK_TOKEN_URL: http://localhost/application/o/token/
      AUTHENTIK_AUTHORIZE_URL: http://localhost/application/o/authorize/
      AUTHENTIK_USERINFO_URL: http://localhost/application/o/userinfo/
      LOCAL_LOGIN_ENABLED: "true"
      LOCAL_LOGIN_EMAIL: it.j@cqv.kr
      LOCAL_LOGIN_NAME: IT Local Admin
      LOCAL_LOGIN_DEPARTMENT: IT
      LOCAL_LOGIN_ROLE: admin
      SECRET_KEY: local-dev-secret-key
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
      FRONTEND_URL: http://localhost:3000/manage/it
      QR_BASE_URL: http://localhost:3000/manage/it
      ASSET_TAG_PREFIX: IT
      ADMIN_EMAILS: '[]'
    volumes:
      - ./backend:/app
      - local-backend-data:/app/data
    ports:
      - "8818:8818"

  frontend:
    image: node:20-alpine
    container_name: itam-local-frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install --no-package-lock && npm run dev -- --host 0.0.0.0 --port 3000"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_LOCAL_LOGIN_ENABLED: "true"
      VITE_LOCAL_LOGIN_EMAIL: it.j@cqv.kr
      VITE_API_PROXY_TARGET: http://backend:8818
    volumes:
      - ./frontend:/app
      - local-frontend-node-modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  local-backend-data:
  local-frontend-node-modules:
